<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo - 7k's Calistenics</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#0A0A0C',
                            card: '#121216',
                            purple: '#8B5CF6',
                            purpleLight: '#A78BFA'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos e Efeitos 3D para a Imagem */
        .perspective-container {
            perspective: 1000px;
        }
        .card-3d {
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(139, 92, 246, 0.3);
        }
        .card-3d img {
            transform: translateZ(40px);
        }
    </style>
</head>
<body class="bg-brand-black text-white min-h-screen flex flex-col items-center justify-center select-none overflow-x-hidden m-0 p-4">

    <!-- Botão de Voltar ao App -->
    <div class="absolute top-6 left-6">
        <a href="index.html" class="bg-brand-card border border-brand-purple/40 px-4 py-2.5 rounded-xl text-xs font-bold text-brand-purpleLight hover:bg-brand-purple hover:text-white transition shadow-lg flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao App
        </a>
    </div>

    <!-- Container central com a Imagem 3D da Santa 7kslow -->
    <div class="text-center max-w-xs w-full mt-10">
        <div class="perspective-container w-full py-4">
            <div id="card3D" class="card-3d bg-brand-card border border-brand-purple/40 rounded-3xl p-4 overflow-hidden relative text-center">
                <div class="absolute inset-0 bg-gradient-to-tr from-brand-purple/20 to-transparent pointer-events-none"></div>
                <div class="relative rounded-2xl overflow-hidden border border-white/10 shadow-2xl inline-block w-full">
                    <!-- Imagem da Santa com o logo 7kslow -->
                    <img src="santa.jpg" alt="Santa 3D - 7kslow" id="santaImg" class="w-full h-auto object-cover rounded-xl" />
                </div>
            </div>
        </div>
        <p class="text-[11px] text-gray-400 mt-4 tracking-widest uppercase font-semibold">
            7k's Calistenics — Área de Estudos 3D
        </p>
    </div>

    <script>
        // Caso prefira garantir que lê o ficheiro local se tiver colocado o nome 'santa.jpg' no repositório:
        const img = document.getElementById('santaImg');
        img.onerror = function() {
            // Fallback caso o ficheiro local não tenha exatamente esse nome no GitHub
            img.src = "https://i.ibb.co/6y4G12s/santa.jpg";
        };

        // Configuração do Efeito 3D Interativo por Movimento
        const card = document.getElementById('card3D');
        if (card) {
            function handleMove(clientX, clientY) {
                const rect = card.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -15;
                const rotateY = ((x - centerX) / centerX) * 15;

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
            }

            card.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
            card.addEventListener('touchmove', (e) => {
                if(e.touches.length > 0) {
                    handleMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, {passive: true});

            card.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });
            card.addEventListener('touchend', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });
        }
    </script>

</body>
</html>
