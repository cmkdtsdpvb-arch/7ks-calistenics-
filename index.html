<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>7k's Calistenics</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#09090B',
                            dark: '#121214',
                            card: '#18181B',
                            border: '#27272A',
                            purple: '#8B5CF6',
                            purpleDark: '#6B21A8',
                            purpleLight: '#A855F7',
                            purpleGlow: 'rgba(139, 92, 246, 0.35)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #09090B;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .glass-panel {
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        .btn-touch:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .animate-pulse-glow {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>
<body class="bg-brand-black min-h-screen flex justify-center text-zinc-100">

    <div class="w-full max-w-md min-h-screen flex flex-col bg-brand-black border-x border-brand-border/40 relative pb-28">

        <!-- HEADER STICKY -->
        <header class="sticky top-0 z-40 bg-brand-dark/90 backdrop-blur-md border-b border-brand-border/60 px-5 pt-4 pb-3 flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-purpleLight to-brand-purpleDark flex items-center justify-center font-heading font-black text-white text-lg shadow-lg shadow-brand-purple/30">
                        7k
                    </div>
                    <div>
                        <h1 class="font-heading font-extrabold text-lg tracking-tight text-white leading-none">
                            7k's <span class="text-brand-purpleLight">Calistenics</span>
                        </h1>
                        <p class="text-[11px] text-zinc-400 font-medium">Treino básico (retorno)</p>
                    </div>
                </div>

                <button onclick="resetAllWorkout()" title="Reiniciar Treino" class="btn-touch px-3 py-1.5 rounded-lg bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 text-xs font-semibold flex items-center gap-1.5 border border-zinc-700/60 transition-all">
                    <i class="fa-solid fa-rotate-right text-brand-purpleLight text-xs"></i>
                    <span>Reset</span>
                </button>
            </div>

            <!-- Workout Progress Bar -->
            <div class="bg-brand-card p-3 rounded-2xl border border-brand-border/80">
                <div class="flex justify-between text-xs font-semibold mb-1.5">
                    <span class="text-zinc-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-fire text-brand-purpleLight"></i> Progresso de Hoje
                    </span>
                    <span id="overallPercentage" class="text-brand-purpleLight font-bold">0%</span>
                </div>
                <div class="w-full bg-zinc-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-zinc-700/40">
                    <div id="overallProgressBar" class="bg-gradient-to-r from-brand-purple to-brand-purpleLight h-full rounded-full transition-all duration-500 ease-out w-0"></div>
                </div>
            </div>
        </header>

        <!-- VIEW 1: WORKOUT TAB -->
        <div id="tabWorkout" class="flex flex-col">
            <!-- WATER BANNER -->
            <section class="px-5 mt-4">
                <div class="glass-panel p-4 rounded-2xl relative overflow-hidden bg-gradient-to-r from-brand-purpleDark/20 via-brand-card to-brand-card">
                    <div class="flex items-start gap-3 relative z-10">
                        <div class="w-10 h-10 rounded-xl bg-blue-500/20 border border-blue-500/30 flex items-center justify-center text-blue-400 shrink-0 mt-0.5">
                            <i class="fa-solid fa-droplet text-lg"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="text-xs font-bold text-white uppercase tracking-wider mb-0.5">Dica de Rendimento</h3>
                            <p class="text-xs text-zinc-300 leading-relaxed">
                                Beba bastante água e faça um descanso de <strong class="text-brand-purpleLight font-semibold">1 minuto</strong> a cada série.
                            </p>
                            
                            <div class="mt-3 pt-2.5 border-t border-zinc-800 flex items-center justify-between">
                                <span class="text-xs text-zinc-400 flex items-center gap-1.5">
                                    <i class="fa-solid fa-glass-water text-blue-400"></i> Água hoje:
                                </span>
                                <div class="flex items-center gap-2">
                                    <button onclick="changeWater(-1)" class="w-6 h-6 rounded-md bg-zinc-800 text-zinc-300 hover:text-white flex items-center justify-center font-bold text-xs btn-touch border border-zinc-700">-</button>
                                    <span id="waterCount" class="text-xs font-bold text-blue-400 min-w-[36px] text-center">0 ml</span>
                                    <button onclick="changeWater(1)" class="w-6 h-6 rounded-md bg-blue-600/30 text-blue-300 hover:bg-blue-600/50 flex items-center justify-center font-bold text-xs btn-touch border border-blue-500/40">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- EXERCISES LIST -->
            <main id="exercisesContainer" class="px-5 mt-5 flex flex-col gap-5">
                <!-- Exercises cards populated by JS -->
            </main>

            <!-- SAVE PROGRESS BUTTON -->
            <div class="px-5 mt-6 mb-4">
                <button onclick="saveCurrentWorkoutToHistory()" class="btn-touch w-full py-4 rounded-2xl bg-gradient-to-r from-brand-purple to-brand-purpleLight hover:brightness-110 text-white font-extrabold text-sm flex items-center justify-center gap-2 shadow-xl shadow-brand-purple/30 border border-brand-purpleLight/40 transition-all">
                    <i class="fa-solid fa-floppy-disk text-base"></i>
                    <span>Salvar Progresso do Treino</span>
                </button>
            </div>
        </div>

        <!-- VIEW 2: PROGRESS HISTORY TAB -->
        <div id="tabProgress" class="flex flex-col hidden px-5 mt-4">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="font-heading font-extrabold text-lg text-white">Histórico de Treinos</h2>
                    <p class="text-xs text-zinc-400">Seus treinos salvos anteriormente</p>
                </div>
                <span id="historyCount" class="px-2.5 py-1 rounded-lg bg-brand-purple/20 text-brand-purpleLight border border-brand-purple/30 text-xs font-bold">
                    0 Registros
                </span>
            </div>

            <!-- History List Container -->
            <div id="historyContainer" class="flex flex-col gap-4">
                <!-- History items populated by JS -->
            </div>
        </div>

        <!-- FLOATING REST TIMER BAR (BOTTOM) -->
        <div id="timerBar" class="fixed bottom-16 left-1/2 -translate-x-1/2 w-full max-w-md bg-brand-dark/95 border-t border-brand-purple/40 backdrop-blur-xl px-5 py-3 z-40 rounded-t-2xl shadow-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="relative flex items-center justify-center">
                    <div id="timerPulse" class="w-10 h-10 rounded-full bg-brand-purple/20 absolute -z-10 transition-all"></div>
                    <div class="w-9 h-9 rounded-full border border-brand-purple/50 bg-brand-card flex items-center justify-center text-brand-purpleLight">
                        <i class="fa-solid fa-stopwatch text-base"></i>
                    </div>
                </div>
                <div>
                    <span class="text-[10px] uppercase font-extrabold text-zinc-400 tracking-wider block">Descanso</span>
                    <div class="flex items-baseline gap-1">
                        <span id="timerDisplay" class="font-heading font-black text-xl text-white tracking-wider">01:00</span>
                        <span class="text-[10px] text-zinc-400 font-medium">min</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="timerToggleBtn" onclick="toggleTimer()" class="btn-touch px-3.5 py-2 rounded-xl bg-brand-purple hover:bg-brand-purpleLight text-white font-bold text-xs flex items-center gap-1.5 shadow-lg shadow-brand-purple/30 transition-all">
                    <i id="timerIcon" class="fa-solid fa-play text-xs"></i>
                    <span id="timerBtnText">Iniciar</span>
                </button>
                <button onclick="resetTimer()" class="btn-touch w-8 h-8 rounded-xl bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center border border-zinc-700/60">
                    <i class="fa-solid fa-rotate-left text-xs"></i>
                </button>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION BAR (IOS STYLE) -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-brand-dark/98 border-t border-brand-border px-8 py-2 z-50 flex justify-around items-center">
            <button id="navBtnWorkout" onclick="switchTab('workout')" class="flex flex-col items-center gap-1 text-brand-purpleLight font-bold transition-all btn-touch">
                <i class="fa-solid fa-dumbbell text-lg"></i>
                <span class="text-[11px]">Treino</span>
            </button>
            <button id="navBtnProgress" onclick="switchTab('progress')" class="flex flex-col items-center gap-1 text-zinc-500 font-medium transition-all btn-touch">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span class="text-[11px]">Progresso</span>
            </button>
        </nav>

    </div>

    <!-- SCRIPT & APP LOGIC -->
    <script>
        const workoutData = [
            {
                id: 'flexoes',
                name: 'Flexões',
                setsCount: 5,
                repsText: '5×10 (50 reps total)',
                worksText: 'Peitoral, tríceps, ombros (deltoide anterior) e core.',
                image: 'https://images.unsplash.com/photo-1598971639058-fab3c3109a00?auto=format&fit=crop&w=600&q=80',
                completedSets: [false, false, false, false, false]
            },
            {
                id: 'barra_fixa',
                name: 'Barra Fixa',
                setsCount: 5,
                repsText: '5×5 (25 reps total)',
                worksText: 'Latíssimo do dorso, bíceps, antebraços, trapézio e romboides.',
                image: 'https://images.unsplash.com/photo-1526506118085-60ce8714f8c5?auto=format&fit=crop&w=600&q=80',
                completedSets: [false, false, false, false, false]
            },
            {
                id: 'barra_australiana',
                name: 'Barra Australiana',
                setsCount: 5,
                repsText: '5×5 (25 reps total)',
                worksText: 'Costas (parte média), bíceps, antebraços e deltoide posterior.',
                image: 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=600&q=80',
                completedSets: [false, false, false, false, false]
            },
            {
                id: 'abdominais',
                name: 'Abdominais',
                setsCount: 5,
                repsText: '5×5 (25 reps total)',
                worksText: 'Reto abdominal e auxilia no fortalecimento do core.',
                image: 'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=600&q=80',
                completedSets: [false, false, false, false, false]
            },
            {
                id: 'prancha',
                name: 'Prancha',
                setsCount: 5,
                repsText: '3 a 5 séries de 30–60 seg',
                worksText: 'Core completo (reto abdominal, transverso, oblíquos e lombar), glúteos e ombros.',
                image: 'https://images.unsplash.com/photo-1566241142559-40e1dab266c6?auto=format&fit=crop&w=600&q=80',
                completedSets: [false, false, false, false, false]
            },
            {
                id: 'agachamentos',
                name: 'Agachamentos',
                setsCount: 5,
                repsText: '5×10 (50 reps total)',
                worksText: 'Quadríceps, glúteos, posteriores da coxa e core.',
                image: 'https://images.unsplash.com/photo-1574680096145-d05b474e2155?auto=format&fit=crop&w=600&q=80',
                completedSets: [false, false, false, false, false]
            },
            {
                id: 'levantamento_calcanhar',
                name: 'Levantamento de Calcanhar',
                setsCount: 5,
                repsText: '5×10 (50 reps total)',
                worksText: 'Panturrilhas (gastrocnêmio e sóleo) e estabilidade do tornozelo.',
                image: 'https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=600&q=80',
                completedSets: [false, false, false, false, false]
            },
            {
                id: 'elevacao_lateral',
                name: 'Elevação Lateral',
                setsCount: 5,
                repsText: '5×5 (25 reps total) com halteres de 4 kg',
                worksText: 'Deltoide lateral, trapézio superior e músculos do manguito rotador.',
                image: 'https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=600&q=80',
                completedSets: [false, false, false, false, false]
            }
        ];

        let state = {
            exercises: JSON.parse(JSON.stringify(workoutData)),
            waterMl: 0,
            history: []
        };

        let timerInterval = null;
        let timerSeconds = 60;
        let isTimerRunning = false;

        function loadSavedState() {
            try {
                const savedState = localStorage.getItem('7k_calistenics_v2_state');
                if (savedState) {
                    const parsed = JSON.parse(savedState);
                    if (parsed.exercises) {
                        parsed.exercises.forEach((savedEx, idx) => {
                            if (state.exercises[idx] && savedEx.completedSets) {
                                state.exercises[idx].completedSets = savedEx.completedSets;
                            }
                        });
                    }
                    if (typeof parsed.waterMl === 'number') state.waterMl = parsed.waterMl;
                    if (Array.isArray(parsed.history)) state.history = parsed.history;
                }
            } catch (e) {
                console.error("Storage error:", e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem('7k_calistenics_v2_state', JSON.stringify({
                    exercises: state.exercises,
                    waterMl: state.waterMl,
                    history: state.history
                }));
            } catch (e) {
                console.error("Save error:", e);
            }
        }

        /* NAVIGATION CONTROL */
        function switchTab(tab) {
            const tabWorkout = document.getElementById('tabWorkout');
            const tabProgress = document.getElementById('tabProgress');
            const btnWorkout = document.getElementById('navBtnWorkout');
            const btnProgress = document.getElementById('navBtnProgress');

            if (tab === 'workout') {
                tabWorkout.classList.remove('hidden');
                tabProgress.classList.add('hidden');
                btnWorkout.className = 'flex flex-col items-center gap-1 text-brand-purpleLight font-bold transition-all btn-touch';
                btnProgress.className = 'flex flex-col items-center gap-1 text-zinc-500 font-medium transition-all btn-touch';
            } else {
                tabWorkout.classList.add('hidden');
                tabProgress.classList.remove('hidden');
                btnProgress.className = 'flex flex-col items-center gap-1 text-brand-purpleLight font-bold transition-all btn-touch';
                btnWorkout.className = 'flex flex-col items-center gap-1 text-zinc-500 font-medium transition-all btn-touch';
                renderHistory();
            }
        }

        /* WORKOUT FUNCTIONS */
        function renderExercises() {
            const container = document.getElementById('exercisesContainer');
            container.innerHTML = '';

            state.exercises.forEach((ex, exIdx) => {
                const completedCount = ex.completedSets.filter(Boolean).length;
                const isAllDone = completedCount === ex.setsCount;

                const card = document.createElement('div');
                card.className = `bg-brand-card rounded-2xl border transition-all duration-300 overflow-hidden ${
                    isAllDone ? 'border-brand-purple/60 bg-brand-card/90' : 'border-brand-border/70'
                }`;

                let setsMarkup = '';
                ex.completedSets.forEach((isDone, setIdx) => {
                    setsMarkup += `
                        <button onclick="toggleSet(${exIdx}, ${setIdx})" 
                            class="btn-touch flex-1 py-2 rounded-xl text-xs font-bold transition-all duration-200 border flex flex-col items-center justify-center gap-0.5 ${
                                isDone 
                                ? 'bg-gradient-to-b from-brand-purple to-brand-purpleDark text-white border-brand-purpleLight/80 shadow-md shadow-brand-purple/20' 
                                : 'bg-zinc-900/80 hover:bg-zinc-800 text-zinc-400 border-zinc-800'
                            }">
                            <span>S${setIdx + 1}</span>
                            <i class="fa-solid ${isDone ? 'fa-circle-check text-white' : 'fa-circle text-zinc-700'} text-[10px]"></i>
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="relative h-40 w-full bg-zinc-900 overflow-hidden">
                        <img src="${ex.image}" alt="${ex.name}" class="w-full h-full object-cover brightness-75">
                        <div class="absolute inset-0 bg-gradient-to-t from-brand-card via-transparent to-black/30"></div>
                        <div class="absolute top-3 left-3 right-3 flex justify-between items-center">
                            <span class="px-2.5 py-1 rounded-lg bg-black/60 backdrop-blur-md border border-white/10 text-[10px] font-bold text-brand-purpleLight tracking-wider uppercase">
                                ${ex.repsText}
                            </span>
                            <span class="px-2.5 py-1 rounded-lg ${isAllDone ? 'bg-green-500/20 text-green-400 border-green-500/40' : 'bg-black/60 text-zinc-300 border-white/10'} border backdrop-blur-md text-[11px] font-semibold flex items-center gap-1">
                                <i class="fa-solid ${isAllDone ? 'fa-check-double text-green-400' : 'fa-list-check'}"></i>
                                ${completedCount}/${ex.setsCount} Séries
                            </span>
                        </div>
                        <div class="absolute bottom-3 left-4 right-4">
                            <h2 class="font-heading font-extrabold text-lg text-white tracking-wide">${ex.name}</h2>
                        </div>
                    </div>
                    <div class="p-4 flex flex-col gap-3">
                        <div class="bg-zinc-900/60 p-2.5 rounded-xl border border-zinc-800/80">
                            <p class="text-xs text-zinc-300 leading-relaxed">
                                <strong class="text-brand-purpleLight font-semibold">Trabalha:</strong> ${ex.worksText}
                            </p>
                        </div>
                        <div class="flex gap-1.5 mt-1">
                            ${setsMarkup}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            updateOverallProgress();
            document.getElementById('waterCount').innerText = `${state.waterMl} ml`;
        }

        function toggleSet(exIdx, setIdx) {
            const currentState = state.exercises[exIdx].completedSets[setIdx];
            state.exercises[exIdx].completedSets[setIdx] = !currentState;
            if (!currentState) {
                startTimerAutomatically();
            }
            saveState();
            renderExercises();
        }

        function updateOverallProgress() {
            let totalSets = 0;
            let completedSets = 0;
            state.exercises.forEach(ex => {
                totalSets += ex.setsCount;
                completedSets += ex.completedSets.filter(Boolean).length;
            });
            const percent = totalSets > 0 ? Math.round((completedSets / totalSets) * 100) : 0;
            document.getElementById('overallPercentage').innerText = `${percent}%`;
            document.getElementById('overallProgressBar').style.width = `${percent}%`;
            return { percent, completedSets, totalSets };
        }

        function changeWater(delta) {
            state.waterMl = Math.max(0, state.waterMl + (delta * 250));
            document.getElementById('waterCount').innerText = `${state.waterMl} ml`;
            saveState();
        }

        function resetAllWorkout() {
            if (confirm("Deseja reiniciar o progresso de hoje?")) {
                state.exercises.forEach(ex => {
                    ex.completedSets = ex.completedSets.map(() => false);
                });
                state.waterMl = 0;
                resetTimer();
                saveState();
                renderExercises();
            }
        }

        /* HISTORY & PROGRESS TAB LOGIC */
        function saveCurrentWorkoutToHistory() {
            const progress = updateOverallProgress();
            const now = new Date();
            const formattedDate = now.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const formattedTime = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            const note = prompt("Deseja adicionar uma nota sobre o treino de hoje? (Ex: Treino forte, aumentei reps):", "Treino de retorno concluído");

            const record = {
                id: Date.now(),
                date: formattedDate,
                time: formattedTime,
                percentage: progress.percent,
                completedSets: progress.completedSets,
                totalSets: progress.totalSets,
                waterMl: state.waterMl,
                notes: note || "Sem anotações"
            };

            state.history.unshift(record);
            saveState();

            alert("Progresso salvo com sucesso na aba 'Progresso'!");
            switchTab('progress');
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            const countLabel = document.getElementById('historyCount');
            container.innerHTML = '';

            countLabel.innerText = `${state.history.length} Registros`;

            if (state.history.length === 0) {
                container.innerHTML = `
                    <div class="glass-panel p-8 rounded-2xl text-center flex flex-col items-center justify-center gap-3">
                        <i class="fa-solid fa-clipboard-list text-3xl text-zinc-600"></i>
                        <p class="text-xs text-zinc-400">Nenhum treino salvo no histórico ainda.<br>Conclua um treino e clique em "Salvar Progresso".</p>
                    </div>
                `;
                return;
            }

            state.history.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'bg-brand-card rounded-2xl border border-brand-border/80 p-4 flex flex-col gap-3 relative overflow-hidden';

                card.innerHTML = `
                    <div class="flex justify-between items-start border-b border-zinc-800 pb-2.5">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-brand-purple/20 text-brand-purpleLight border border-brand-purple/30 flex items-center justify-center font-bold text-xs">
                                <i class="fa-solid fa-calendar-day"></i>
                            </div>
                            <div>
                                <h3 class="text-xs font-bold text-white">${item.date} às ${item.time}</h3>
                                <p class="text-[10px] text-zinc-400">${item.completedSets}/${item.totalSets} Séries Concluídas</p>
                            </div>
                        </div>
                        <span class="px-2 py-0.5 rounded-md bg-brand-purple/20 text-brand-purpleLight font-extrabold text-xs border border-brand-purple/40">
                            ${item.percentage}%
                        </span>
                    </div>

                    <div class="flex items-center justify-between text-xs text-zinc-300 bg-zinc-900/60 p-2.5 rounded-xl border border-zinc-800">
                        <span class="flex items-center gap-1.5 text-blue-400">
                            <i class="fa-solid fa-droplet"></i> ${item.waterMl} ml de água
                        </span>
                        <div class="flex items-center gap-2">
                            <button onclick="editHistoryNote(${item.id})" title="Editar Nota" class="w-7 h-7 rounded-lg bg-zinc-800 text-zinc-300 hover:text-white flex items-center justify-center btn-touch border border-zinc-700">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteHistoryRecord(${item.id})" title="Excluir Registro" class="w-7 h-7 rounded-lg bg-red-950/40 text-red-400 hover:text-red-300 flex items-center justify-center btn-touch border border-red-800/40">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div class="text-xs text-zinc-300 italic bg-brand-black/40 p-2.5 rounded-xl border border-zinc-800/60">
                        "${item.notes}"
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function editHistoryNote(id) {
            const item = state.history.find(r => r.id === id);
            if (!item) return;

            const newNote = prompt("Editar nota/observação deste treino:", item.notes);
            if (newNote !== null) {
                item.notes = newNote;
                saveState();
                renderHistory();
            }
        }

        function deleteHistoryRecord(id) {
            if (confirm("Tem certeza que deseja apagar este registro de treino?")) {
                state.history = state.history.filter(r => r.id !== id);
                saveState();
                renderHistory();
            }
        }

        /* TIMER FUNCTIONS */
        function startTimerAutomatically() {
            resetTimer();
            toggleTimer();
        }

        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                updateTimerUI(false);
            } else {
                isTimerRunning = true;
                updateTimerUI(true);
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        formatTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        updateTimerUI(false);
                        playFinishSound();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = 60;
            formatTimerDisplay();
            updateTimerUI(false);
        }

        function formatTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timerDisplay').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimerUI(running) {
            const btn = document.getElementById('timerToggleBtn');
            const icon = document.getElementById('timerIcon');
            const text = document.getElementById('timerBtnText');
            const pulse = document.getElementById('timerPulse');

            if (running) {
                btn.className = 'btn-touch px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs flex items-center gap-1.5 shadow-lg transition-all';
                icon.className = 'fa-solid fa-pause text-xs';
                text.innerText = 'Pausar';
                pulse.classList.add('animate-pulse-glow');
            } else {
                btn.className = 'btn-touch px-3.5 py-2 rounded-xl bg-brand-purple hover:bg-brand-purpleLight text-white font-bold text-xs flex items-center gap-1.5 shadow-lg shadow-brand-purple/30 transition-all';
                icon.className = 'fa-solid fa-play text-xs';
                text.innerText = timerSeconds < 60 ? 'Continuar' : 'Iniciar';
                pulse.classList.remove('animate-pulse-glow');
            }
        }

        function playFinishSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch (e) {}
        }

        window.onload = function() {
            loadSavedState();
            renderExercises();
        };
    </script>
</body>
</html>
